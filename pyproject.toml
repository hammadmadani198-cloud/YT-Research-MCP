[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "youtube-niche-finder-mcp"
version = "0.9.0"
description = "Evidence-led YouTube niche research MCP; offline core analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=2.2,<3", "pydantic>=2.10,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
transcripts = ["youtube-transcript-api>=1.2,<2", "yt-dlp>=2026.10.26"]

[project.scripts]
youtube-niche-mcp = "youtube_niche_mcp.cli:main"
youtube-niche-mcp-server = "youtube_niche_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_niche_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["stdio: local MCP subprocess protocol integration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
